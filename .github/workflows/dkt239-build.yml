name: DKT-239 exact candidate build

on:
  pull_request:
    paths:
      - .github/workflows/dkt239-build.yml

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 90
    env:
      EXPECTED_SHA: 176428d5fc865f408f9d593edbaefa91242b9c4c
      BAZEL_REMOTE_USER: ""
      BAZEL_REMOTE_PASSWORD: ""
    steps:
      - name: Check out exact reviewed candidate
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: 176428d5fc865f408f9d593edbaefa91242b9c4c
          persist-credentials: false

      - name: Verify exact source and credential-blind boundary
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test -z "${BAZEL_REMOTE_USER:-}"
          test -z "${BAZEL_REMOTE_PASSWORD:-}"
          test -z "${APPLE_CERTIFICATE_P12:-}"
          test -z "${APPLE_API_KEY:-}"

      - name: Install exact Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.14"

      - name: Install locked dependencies
        run: bun install --frozen-lockfile

      - name: Build Darwin arm64 native addon
        uses: ./.github/actions/bazel-natives
        with:
          targets: darwin-arm64
          cache-scope: dkt239-darwin-arm64

      - name: Build exact Darwin arm64 OMP binary
        env:
          RELEASE_TARGETS: darwin-arm64
        run: bun run ci:release:build-binaries

      - name: Smoke exact binary and record checksum
        shell: bash
        run: |
          set -euo pipefail
          binary=packages/coding-agent/binaries/omp-darwin-arm64
          test -x "$binary"
          runtime_dir="$(mktemp -d)"
          HOME="$runtime_dir/home" XDG_DATA_HOME="$runtime_dir/xdg" "$binary" --version
          HOME="$runtime_dir/home" XDG_DATA_HOME="$runtime_dir/xdg" "$binary" --smoke-test
          shasum -a 256 "$binary" | tee omp-darwin-arm64.sha256
          printf '%s\n' "$EXPECTED_SHA" > omp-source.sha

      - name: Upload exact binary and provenance
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dkt239-omp-darwin-arm64-176428d5
          path: |
            packages/coding-agent/binaries/omp-darwin-arm64
            omp-darwin-arm64.sha256
            omp-source.sha
          retention-days: 1
          if-no-files-found: error
